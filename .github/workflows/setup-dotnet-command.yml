name: setup-dotnet command containment
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  statuses: write
jobs:
  probe:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out lower tree strictly as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: lower-data
          persist-credentials: false
          set-safe-directory: false
          allow-unsafe-pr-checkout: true
      - id: normal
        name: Normal config control
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          source-url: https://packages.invalid/index.json
          config-file: lower-data/normal.config
          owner: controlled-owner
        env:
          NUGET_AUTH_TOKEN: inert-normal-token
      - id: injected
        name: Lower config filename input
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          source-url: https://packages.invalid/index.json
          config-file: lower-data/${{ github.event.pull_request.body }}
          owner: controlled-owner
        env:
          NUGET_AUTH_TOKEN: inert-injected-token
      - name: Fixed owner status sink
        if: steps.injected.outputs.probe == 'DOTNETCMDLIVE-1d0135edd3bf8b98a54d'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          body = json.dumps({
              'state': 'success',
              'context': 'setup-dotnet-command-40bdba8179ab',
              'description': 'inert setup-dotnet command containment',
          }, separators=(',', ':')).encode()
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/statuses/' + os.environ['TARGET_SHA'],
              data=body,
              method='POST',
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'setup-dotnet-command-containment',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print('STATUS_SINK ' + json.dumps({'status': response.status}, sort_keys=True))
          PY
      - name: Fixed output oracle
        if: always()
        env:
          NORMAL_PROBE: ${{ steps.normal.outputs.probe }}
          INJECTED_PROBE: ${{ steps.injected.outputs.probe }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          normal = os.environ.get('NORMAL_PROBE', '')
          injected = os.environ.get('INJECTED_PROBE', '')
          result = {
              'normal_probe_empty': normal == '',
              'normal_gate_false': normal != 'DOTNETCMDLIVE-1d0135edd3bf8b98a54d',
              'injected_probe_exact': hashlib.sha256(injected.encode()).hexdigest() == '94cf18f8bfb605df431c650fd655c67df0704b5d45b2816feab36a8bac0c2095' and len(injected) == 34,
              'injected_probe_sha256': hashlib.sha256(injected.encode()).hexdigest(),
              'injected_probe_length': len(injected),
          }
          print('SETUP_DOTNET_COMMAND_ORACLE ' + json.dumps(result, sort_keys=True, separators=(',', ':')))
          PY
